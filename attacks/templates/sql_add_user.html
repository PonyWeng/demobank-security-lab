{% extends 'base.html' %}{% block content %}<section class="panel"><h1>新增課程使用者</h1><p>新帳號可登入課程入口並進入全部 Lab。</p><form method="post"><input name="csrf_token" type="hidden" value="{{ token() }}"><label>帳號<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}"></label><label>密碼<input name="password" type="password" required minlength="8" maxlength="128"></label><label class="checkbox"><input type="checkbox" name="isAdmin">教師角色</label><button>新增使用者</button></form><p role="status">{{ message }}</p><a href="/">返回實驗</a></section>{% endblock %}
