{% extends 'base.html' %}{% block content %}<section class="panel"><p>SQL、XSS、Collector 共用帳號，一次註冊即可；已有帳號請直接登入。</p><h1>{{ '課程代碼' if access else '建立帳號' if register else '教師登入（參數化 SQL）' if is_teacher else '登入' }}</h1><form method="post"><input name="csrf_token" type="hidden" value="{{ token() }}">{% if access %}<label>課程代碼<input name="code" type="password" required></label>{% else %}<label>帳號<input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" required></label><label>密碼<input name="password" type="password" required {% if register %}minlength="8" maxlength="128"{% endif %}></label>{% endif %}<button>送出</button></form><p><a href="/register">註冊學生帳號</a></p></section>{% endblock %}
