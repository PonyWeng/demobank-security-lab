{% extends 'base.html' %}{% block content %}<section class="panel"><h1>修改教師密碼</h1><p>同步更新所有 Lab 的 pony 密碼與 JSON；其他登入失效。</p><form method="post"><input type="hidden" name="csrf_token" value="{{ token() }}"><label>目前密碼<input name="old_password" type="password" required autocomplete="current-password"></label><label>新密碼<input name="new_password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><label>確認<input name="confirmation" type="password" required autocomplete="new-password"></label><button>同步修改密碼</button></form></section>{% endblock %}
