<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL Injection Login</title>
    <link rel="stylesheet" href="/static/sql_login.css">
</head>
<body>

<div class="login-box">
    <h1>SQL injection Practice</h1>
    <h2>{{ 'Teacher Login' if is_teacher else 'Login' }}</h2>

    <form method="POST"><input type="hidden" name="csrf_token" value="{{ token() }}">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" autocomplete="username">

        <label for="password">Password</label>
        <input type="password" name="password" id="password" autocomplete="current-password">

        <button type="submit">Login</button>
    </form>

    
{% include 'login_links.html' %}
</div>
{% include 'original_footer.html' %}
</body>
</html>
