{% extends 'base.html' %}{% block content %}<h1>SQL 模擬登入</h1><p>平台身分：{{ session.username }}。此處的注入只改變模擬結果，不會改變角色。</p><section class="panel"><form method="post"><input name="csrf_token" type="hidden" value="{{ token() }}"><label>模擬 Username<input name="username" required></label><label>模擬 Password<input name="password" type="password" required></label><button>執行模擬登入</button></form>{% if result %}<div class="message" role="status">{{ result }}</div><pre>{{ query }}</pre>{% endif %}<p>測試 Username：<code>' OR 1=1 -- </code>，密碼任意。切換 Protected 比較。</p><a href="/">返回資料表</a></section>{% endblock %}
