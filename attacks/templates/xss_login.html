<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入</title>
    <link rel="stylesheet" href="/static/xss_login.css">
</head>

<body>

    <div class="login-container">
        <h2>{{ '酷酷的留言板 · 教師登入' if is_teacher else '酷酷的留言板' }}</h2>

        <form method="post"><input type="hidden" name="csrf_token" value="{{ token() }}">

            <div class="field-group">
                <label for="username">帳號</label>
                <input type="text" name="username" id="username" autocomplete="username" placeholder="請輸入帳號" required>
            </div>

            <div class="field-group password-box">
                <label for="pw">密碼</label>
                <input type="password" name="password" autocomplete="current-password" id="pw" placeholder="請輸入密碼" required>
                
            </div>

            <button type="submit">登入</button>
        </form>

        <div class="register-link">
            還沒有帳號？ <a href="/register">註冊</a>
        </div>
    {% include 'login_links.html' %}
</div>

{% include 'original_footer.html' %}
</body>

</html>
