{% extends 'base.html' %}{% block content %}<h1>管理中心</h1><table><tr><th>帳號</th><th>角色</th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ '管理員' if u.is_admin else '學生' }}</td></tr>{% endfor %}</table><section class="panel"><h2>公開端點</h2><form method="post"><input name="csrf_token" type="hidden" value="{{ token() }}">{% for key,value in urls.items() %}<label>{{ key }} 網址<input name="{{ key }}" value="{{ value }}" required type="url"></label>{% endfor %}<button>儲存端點</button></form></section><section class="panel"><h2>重置</h2><p>刪除學生、留言與收集紀錄；管理員及端點保留。</p><form action="/admin/reset" method="post"><input name="csrf_token" type="hidden" value="{{ token() }}"><label>確認<input name="confirmation" placeholder="RESET" required pattern="RESET"></label><button>重置</button></form></section>{% endblock %}
